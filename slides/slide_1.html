<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1c1917);
            color: #ffffff;
            font-family: system-ui, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
        }
        .badge {
            background: linear-gradient(90deg, #f97316, #ea580c);
            padding: 10px 28px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 24px;
            letter-spacing: 0.05em;
        }
        .brand {
            font-size: 14px;
            color: #38bdf8;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        h1 {
            color: #fff;
            font-size: 32px;
            margin: 0 0 16px 0;
            max-width: 600px;
            line-height: 1.25;
        }
        p {
            font-size: 20px;
            color: #cbd5e1;
            max-width: 520px;
            line-height: 1.5;
            margin: 0;
        }
        .svg-container {
            margin-top: 28px;
        }
    </style>
</head>
<body>
    <div class="brand">MenuMatch AI</div>
    <div class="badge">📸 OCR SCAN</div>
    <h1>MenuMatch AI — OCR Menu Scan</h1>
    <p>Snap any restaurant menu and MenuMatch AI instantly extracts every dish, price, and description using smart OCR.</p>
    <div class="svg-container"><svg width="140" height="140" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="1.5">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="M7 9h10M7 13h6"/>
        <circle cx="17" cy="8" r="3" fill="#f97316" stroke="none"/>
        <path d="M16 8h2M17 7v2" stroke="#fff" stroke-width="1"/>
    </svg></div>
</body>
</html>
