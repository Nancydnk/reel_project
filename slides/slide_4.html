<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes zoomIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI", system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f97316, #ec4899, #8b5cf6, #06b6d4, #22c55e, #f97316);
            background-size: 500% 500%;
            animation: gradientShift 8s ease infinite;
            color: #fff;
        }
        .card {
            width: 920px;
            padding: 44px 40px;
            text-align: center;
            background: rgba(10, 10, 30, 0.62);
            border: 3px solid rgba(255, 255, 255, 0.28);
            border-radius: 40px;
            backdrop-filter: blur(16px);
            animation: zoomIn 0.9s ease-out both;
        }
        .brand {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.18em;
            animation: zoomIn 0.8s ease-out 0.1s both;
        }
        .badge {
            display: inline-block;
            margin: 18px 0 22px;
            padding: 14px 32px;
            border-radius: 999px;
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(90deg, #f97316, #ec4899, #8b5cf6);
            animation: zoomIn 0.9s ease-out 0.25s both;
        }
        h1 {
            margin: 0 0 16px;
            font-size: 48px;
            font-weight: 900;
            text-shadow: 0 0 24px rgba(236, 72, 153, 0.6);
            animation: zoomIn 1s ease-out 0.4s both;
        }
        p {
            margin: 0 0 32px;
            font-size: 24px;
            color: #fef9c3;
            line-height: 1.45;
            animation: zoomIn 1s ease-out 0.55s both;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        .pick {
            padding: 22px 16px;
            border-radius: 24px;
            font-weight: 900;
            font-size: 24px;
            animation: zoomIn 0.8s ease-out both;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }
        .pick:nth-child(1) { background: linear-gradient(135deg, #22c55e, #16a34a); animation-delay: 0.7s; }
        .pick:nth-child(2) { background: linear-gradient(135deg, #38bdf8, #2563eb); animation-delay: 0.9s; }
        .pick:nth-child(3) { background: linear-gradient(135deg, #a855f7, #7c3aed); animation-delay: 1.1s; }
        .pick:nth-child(4) { background: linear-gradient(135deg, #ef4444, #dc2626); animation-delay: 1.3s; }
        .pick-icon { font-size: 40px; display: block; margin-bottom: 8px; animation: wiggle 2s ease-in-out infinite; }
        .pick:nth-child(2) .pick-icon { animation-delay: 0.3s; }
        .pick:nth-child(3) .pick-icon { animation-delay: 0.6s; }
        .pick:nth-child(4) .pick-icon { animation-delay: 0.9s; }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">🍽️ MenuMatch AI</div>
        <div class="badge">🍽️ PICKS</div>
        <h1>Categorized Recommendations</h1>
        <p>Get dishes sorted into Must Try, Safe Bet, Hidden Gem, and Skip It — personalized to your taste.</p>
        <div class="grid">
            <div class="pick"><span class="pick-icon">⭐</span>Must Try</div>
            <div class="pick"><span class="pick-icon">✅</span>Safe Bet</div>
            <div class="pick"><span class="pick-icon">💎</span>Hidden Gem</div>
            <div class="pick"><span class="pick-icon">🚫</span>Skip It</div>
        </div>
    </div>
</body>
</html>
