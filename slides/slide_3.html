<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1c1917);
            color: #ffffff;
            font-family: system-ui, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
        }
        .badge {
            background: linear-gradient(90deg, #f97316, #ea580c);
            padding: 10px 28px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 24px;
            letter-spacing: 0.05em;
        }
        .brand {
            font-size: 14px;
            color: #38bdf8;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        h1 {
            color: #fff;
            font-size: 32px;
            margin: 0 0 16px 0;
            max-width: 600px;
            line-height: 1.25;
        }
        p {
            font-size: 20px;
            color: #cbd5e1;
            max-width: 520px;
            line-height: 1.5;
            margin: 0;
        }
        .svg-container {
            margin-top: 28px;
        }
    </style>
</head>
<body>
    <div class="brand">MenuMatch AI</div>
    <div class="badge">💬 SENTIMENT</div>
    <h1>Review Sentiment Analysis</h1>
    <p>Our NLP engine reads thousands of reviews to score each dish by praise, complaints, and mention frequency.</p>
    <div class="svg-container"><svg width="140" height="140" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.5">
        <rect x="4" y="14" width="3" height="6" fill="#22c55e" stroke="none" rx="1"/>
        <rect x="10" y="10" width="3" height="10" fill="#eab308" stroke="none" rx="1"/>
        <rect x="16" y="6" width="3" height="14" fill="#ef4444" stroke="none" rx="1"/>
        <path d="M3 20h18"/>
        <circle cx="5.5" cy="5" r="1.5" fill="#22c55e" stroke="none"/>
        <circle cx="11.5" cy="3" r="1.5" fill="#eab308" stroke="none"/>
        <circle cx="17.5" cy="2" r="1.5" fill="#ef4444" stroke="none"/>
    </svg></div>
</body>
</html>
