<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes growBar {
            from { width: 0%; }
        }
        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI", system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #7c3aed, #db2777, #059669, #7c3aed);
            background-size: 400% 400%;
            animation: gradientShift 7s ease infinite;
            color: #fff;
        }
        .card {
            width: 900px;
            padding: 48px 44px;
            background: rgba(20, 10, 40, 0.65);
            border: 3px solid rgba(167, 139, 250, 0.45);
            border-radius: 36px;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 60px rgba(219, 39, 119, 0.35);
            animation: fadeUp 0.9s ease-out both;
        }
        .brand {
            text-align: center;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.18em;
            color: #f0abfc;
            animation: fadeUp 0.8s ease-out 0.1s both;
        }
        .badge {
            display: block;
            width: fit-content;
            margin: 18px auto 24px;
            padding: 12px 28px;
            border-radius: 999px;
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            animation: fadeUp 0.9s ease-out 0.2s both;
        }
        h1 {
            text-align: center;
            margin: 0 0 16px;
            font-size: 46px;
            font-weight: 900;
            animation: fadeUp 1s ease-out 0.35s both;
        }
        p {
            text-align: center;
            margin: 0 0 32px;
            font-size: 24px;
            color: #fce7f3;
            line-height: 1.45;
            animation: fadeUp 1s ease-out 0.5s both;
        }
        .chart {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }
        .bar-row {
            animation: fadeUp 0.8s ease-out both;
        }
        .bar-row:nth-child(1) { animation-delay: 0.7s; }
        .bar-row:nth-child(2) { animation-delay: 1.1s; }
        .bar-row:nth-child(3) { animation-delay: 1.5s; }
        .label {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .track {
            height: 34px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        .fill {
            height: 100%;
            border-radius: 999px;
            animation: growBar 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .fill.a { width: 88%; background: linear-gradient(90deg, #22c55e, #4ade80); animation-delay: 0.9s; }
        .fill.b { width: 72%; background: linear-gradient(90deg, #eab308, #facc15); animation-delay: 1.3s; }
        .fill.c { width: 35%; background: linear-gradient(90deg, #ef4444, #fb7185); animation-delay: 1.7s; }
        .emoji-deco {
            text-align: center;
            margin-top: 28px;
            font-size: 34px;
            animation: sparkle 1.5s ease-in-out 2s infinite;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">💬 MenuMatch AI</div>
        <div class="badge">💬 SENTIMENT</div>
        <h1>Review Sentiment Analysis</h1>
        <p>Our NLP engine reads thousands of reviews to score each dish by praise, complaints, and mention frequency.</p>
        <div class="chart">
            <div class="bar-row">
                <div class="label"><span>😍 Positive Praise</span><span>88%</span></div>
                <div class="track"><div class="fill a"></div></div>
            </div>
            <div class="bar-row">
                <div class="label"><span>😐 Mixed Mentions</span><span>72%</span></div>
                <div class="track"><div class="fill b"></div></div>
            </div>
            <div class="bar-row">
                <div class="label"><span>😤 Complaints</span><span>35%</span></div>
                <div class="track"><div class="fill c"></div></div>
            </div>
        </div>
        <div class="emoji-deco">⭐ 📊 🔥</div>
    </div>
</body>
</html>
