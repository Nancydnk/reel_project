<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes slideInLeft {
            0% { opacity: 0; transform: translateX(-80px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInRight {
            0% { opacity: 0; transform: translateX(80px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes bouncePin {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-22px) scale(1.08); }
        }
        @keyframes ringPulse {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI", system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0ea5e9, #06b6d4, #8b5cf6, #ec4899, #0ea5e9);
            background-size: 400% 400%;
            animation: gradientShift 5s ease infinite;
            color: #fff;
        }
        .card {
            position: relative;
            text-align: center;
            padding: 56px 48px;
            max-width: 920px;
            background: rgba(8, 30, 60, 0.6);
            border: 3px solid rgba(56, 189, 248, 0.5);
            border-radius: 40px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 50px rgba(6, 182, 212, 0.35);
        }
        .brand {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 0.2em;
            color: #67e8f9;
            animation: slideInLeft 0.8s ease-out both;
        }
        .badge {
            display: inline-block;
            margin: 20px 0 28px;
            padding: 14px 32px;
            border-radius: 999px;
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(90deg, #06b6d4, #3b82f6, #8b5cf6);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.6);
            animation: slideInRight 0.9s ease-out 0.15s both;
        }
        h1 {
            margin: 0 0 20px;
            font-size: 50px;
            font-weight: 900;
            line-height: 1.15;
            text-shadow: 0 0 30px rgba(34, 211, 238, 0.6);
            animation: slideInLeft 1s ease-out 0.35s both;
        }
        p {
            margin: 0;
            font-size: 26px;
            line-height: 1.5;
            color: #e0f2fe;
            font-weight: 600;
            animation: slideInRight 1s ease-out 0.55s both;
        }
        .svg-wrap {
            position: relative;
            margin-top: 36px;
            display: inline-block;
            animation: slideInLeft 1.1s ease-out 0.75s both;
        }
        .ring {
            position: absolute;
            inset: -20px;
            border: 3px solid #22d3ee;
            border-radius: 50%;
            animation: ringPulse 2s ease-out infinite;
        }
        .svg-container {
            animation: bouncePin 2s ease-in-out 1.2s infinite;
            filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.9));
        }
        .emoji-row {
            margin-top: 24px;
            font-size: 36px;
            letter-spacing: 12px;
            animation: slideInRight 1s ease-out 0.9s both;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">📍 MenuMatch AI</div>
        <div class="badge">📍 GPS ID</div>
        <h1>GPS Restaurant Identification</h1>
        <p>GPS pinpoints your location and automatically matches you to the correct restaurant in our database.</p>
        <div class="svg-wrap">
            <div class="ring"></div>
            <div class="svg-container"><svg width="160" height="160" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.5">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
                <circle cx="12" cy="9" r="2.5" fill="#38bdf8" stroke="none"/>
                <rect x="8" y="18" width="8" height="3" rx="1" fill="#38bdf8" stroke="none" opacity="0.6"/>
            </svg></div>
        </div>
        <div class="emoji-row">🗺️ 🎯 🏪</div>
    </div>
</body>
</html>
