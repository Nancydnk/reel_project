<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1c1917);
            color: #ffffff;
            font-family: system-ui, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
        }
        .badge {
            background: linear-gradient(90deg, #f97316, #ea580c);
            padding: 10px 28px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 24px;
            letter-spacing: 0.05em;
        }
        .brand {
            font-size: 14px;
            color: #38bdf8;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        h1 {
            color: #fff;
            font-size: 32px;
            margin: 0 0 16px 0;
            max-width: 600px;
            line-height: 1.25;
        }
        p {
            font-size: 20px;
            color: #cbd5e1;
            max-width: 520px;
            line-height: 1.5;
            margin: 0;
        }
        .svg-container {
            margin-top: 28px;
        }
    </style>
</head>
<body>
    <div class="brand">MenuMatch AI</div>
    <div class="badge">📍 GPS ID</div>
    <h1>GPS Restaurant Identification</h1>
    <p>GPS pinpoints your location and automatically matches you to the correct restaurant in our database.</p>
    <div class="svg-container"><svg width="140" height="140" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.5">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
        <circle cx="12" cy="9" r="2.5" fill="#38bdf8" stroke="none"/>
        <rect x="8" y="18" width="8" height="3" rx="1" fill="#38bdf8" stroke="none" opacity="0.6"/>
    </svg></div>
</body>
</html>
